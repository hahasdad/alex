<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1190" viewBox="0 0 1120 1190" role="img" aria-labelledby="title desc"><title id="title">Provisional 2FA flow — PRD not supplied</title><desc id="desc">Illustrative sign-in flow. First factor validation, conditional second factor challenge, server verification and session creation. Recovery and failure policies remain unresolved.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#72582e"/></marker></defs><rect width="1120" height="1190" fill="#faf7ef"/><g font-family="Arial,sans-serif" fill="#242117"><text x="60" y="62" font-size="30" font-weight="700">Two-factor authentication</text><text x="60" y="96" font-size="18" fill="#946221">PROVISIONAL · Illustrative assumptions · Not grounded in a PRD</text><text x="60" y="128" font-size="16">No PRD was attached. The four supplied Figma screens depict a portfolio, not authentication.</text><rect x="390" y="170" width="330" height="55" rx="28" fill="#dfebdf" stroke="#9f8961" stroke-width="1.5" /><text x="555" y="203.5" text-anchor="middle" font-size="17">Sign-in attempt</text><path d="M555 225 V255" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="255" width="330" height="65" rx="10" fill="#fff" stroke="#9f8961" stroke-width="1.5" /><text x="555" y="293.5" text-anchor="middle" font-size="17">Server validates first factor</text><path d="M555 320 V355" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="355" width="330" height="65" rx="10" fill="#fff" stroke="#9f8961" stroke-width="1.5" /><text x="555" y="393.5" text-anchor="middle" font-size="17">First factor valid?</text><path d="M720 387 H800" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="375" font-size="15" fill="#72582e">No</text><rect x="800" y="357" width="255" height="60" rx="28" fill="#dfebdf" stroke="#9f8961" stroke-width="1.5" /><text x="927.5" y="393" text-anchor="middle" font-size="17">Reject sign-in</text><path d="M555 420 V460" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><text x="568" y="446" font-size="15" fill="#72582e">Yes</text><rect x="390" y="460" width="330" height="65" rx="10" fill="#fff" stroke="#9f8961" stroke-width="1.5" /><text x="555" y="498.5" text-anchor="middle" font-size="17">Second factor required?</text><path d="M390 492 H190 V945 H390" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="480" font-size="15" fill="#72582e">No</text><path d="M555 525 V565" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><text x="568" y="550" font-size="15" fill="#72582e">Yes</text><rect x="390" y="565" width="330" height="75" rx="10" fill="#fff" stroke="#9f8961" stroke-width="1.5" /><text x="555" y="597" text-anchor="middle" font-size="17">Present enrolled</text><text x="555" y="620" text-anchor="middle" font-size="17">second-factor challenge</text><path d="M555 640 V680" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="680" width="330" height="65" rx="10" fill="#fff" stroke="#9f8961" stroke-width="1.5" /><text x="555" y="718.5" text-anchor="middle" font-size="17">Factor available?</text><path d="M720 712 H800" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="700" font-size="15" fill="#72582e">No</text><rect x="800" y="670" width="255" height="85" rx="10" fill="#fae6c4" stroke="#9f8961" stroke-width="1.5" stroke-dasharray="5 4"/><text x="927.5" y="707" text-anchor="middle" font-size="17">Recovery path</text><text x="927.5" y="730" text-anchor="middle" font-size="17">PRD required</text><path d="M555 745 V785" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><text x="568" y="770" font-size="15" fill="#72582e">Yes</text><rect x="390" y="785" width="330" height="75" rx="10" fill="#fff" stroke="#9f8961" stroke-width="1.5" /><text x="555" y="817" text-anchor="middle" font-size="17">Server verifies proof</text><text x="555" y="840" text-anchor="middle" font-size="17">Valid and fresh?</text><path d="M720 822 H800" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="810" font-size="15" fill="#72582e">No</text><rect x="800" y="790" width="255" height="95" rx="10" fill="#fae6c4" stroke="#9f8961" stroke-width="1.5" stroke-dasharray="5 4"/><text x="927.5" y="820.5" text-anchor="middle" font-size="17">Retry or deny</text><text x="927.5" y="843.5" text-anchor="middle" font-size="17">Limits, expiry and policy</text><text x="927.5" y="866.5" text-anchor="middle" font-size="17">PRD required</text><path d="M925 790 V602 H720" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><text x="805" y="580" font-size="15" fill="#72582e">If policy permits retry</text><path d="M555 860 V910" fill="none" stroke="#72582e" stroke-width="2" marker-end="url(#arrow)"/><text x="568" y="890" font-size="15" fill="#72582e">Yes</text><rect x="390" y="910" width="330" height="70" rx="28" fill="#dfebdf" stroke="#9f8961" stroke-width="1.5" /><text x="555" y="951" text-anchor="middle" font-size="17">Create authenticated session</text><text x="60" y="1045" font-size="19" font-weight="700">Requirements still needed</text><text x="60" y="1080" font-size="16">Enrollment · factor types · when 2FA applies · expiry · retry limits · recovery · trusted devices</text><text x="60" y="1110" font-size="16">Every step is illustrative; no product-specific policy is asserted. No authentication is implemented.</text><text x="60" y="1140" font-size="16">Replace this draft after the PRD is available.</text></g></svg>